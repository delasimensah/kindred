<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="welcome-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col px-6 relative overflow-hidden">

  <div class="absolute -top-24 -right-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 -left-24 w-56 h-56 bg-[#FFD369]/5 rounded-full blur-3xl pointer-events-none"></div>

  <div id="welcome-hero" class="flex-1 flex flex-col items-center justify-center relative z-10">
    <div class="w-24 h-24 rounded-3xl bg-[#393E46] flex items-center justify-center mb-6 border border-[#FFD369]/20">
      <i class="fa-solid fa-headphones-simple text-[#FFD369] text-3xl"></i>
    </div>
    <h1 class="font-semibold text-3xl text-[#EEEEEE] text-center">Find your sound.</h1>
    <p class="text-base text-[#EEEEEE]/50 mt-2 text-center">Back rising African artists.</p>
  </div>

  <div id="welcome-actions" class="relative z-10 pb-10 flex flex-col gap-2">
    <button type="button" id="welcome-create" class="w-full bg-[#FFD369] text-[#222831] font-semibold text-lg py-4 rounded-full shadow-lg shadow-[#FFD369]/20">
      Create account
    </button>
    <button type="button" id="welcome-signin" class="w-full border border-[#FFD369] text-[#FFD369] font-semibold text-lg py-4 rounded-full">
      Sign in
    </button>
  </div>

</div>
</body>
</html>
