<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="signin-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col px-6 relative overflow-hidden">

  <div class="absolute -top-24 -right-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 -left-24 w-56 h-56 bg-[#FFD369]/5 rounded-full blur-3xl pointer-events-none"></div>

  <div id="signin-content" class="flex-1 flex flex-col relative z-10 pt-16">
    <button type="button" id="signin-back" class="h-11 w-11 flex items-center justify-center text-[#EEEEEE]" aria-label="Back">
      <i class="fa-solid fa-chevron-left text-xl"></i>
    </button>

    <h2 class="font-semibold text-3xl text-[#EEEEEE] mt-6">What's your email?</h2>
    <p class="text-base text-[#EEEEEE]/50 mt-2">We'll use this to sign you in.</p>

    <form id="signin-form" class="flex flex-col gap-4 mt-8">
      <div id="field-email" class="bg-[#393E46] rounded-[10px] px-4 py-4 flex items-center gap-3 border border-white/5">
        <i class="fa-regular fa-envelope text-[#EEEEEE]/40 text-sm w-4"></i>
        <input type="email" value="efua.boateng@kindredmail.com" placeholder="you@email.com" class="bg-transparent text-[#EEEEEE] text-sm placeholder:text-[#EEEEEE]/30 outline-none w-full">
      </div>

      <button type="button" id="signin-continue" class="mt-2 w-full bg-[#FFD369] text-[#222831] font-semibold text-base py-4 rounded-full shadow-lg shadow-[#FFD369]/20">
        Continue
      </button>
    </form>
  </div>
</div>
</body>
</html>
