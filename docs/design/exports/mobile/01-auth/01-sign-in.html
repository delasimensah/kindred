<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="signin-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col px-6 relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -right-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute top-1/3 -left-24 w-56 h-56 bg-[#FFD369]/5 rounded-full blur-3xl pointer-events-none"></div>

  <div id="signin-content" class="flex-1 flex flex-col justify-center max-w-[360px] mx-auto w-full relative z-10 py-16">

    <!-- Wordmark -->
    <div id="signin-wordmark" class="flex flex-col items-center mb-10">
      <div class="w-14 h-14 rounded-2xl bg-[#393E46] flex items-center justify-center mb-4 border border-[#FFD369]/20">
        <i class="fa-solid fa-headphones-simple text-[#FFD369] text-xl"></i>
      </div>
      <h1 class="font-display font-bold text-3xl text-[#EEEEEE] tracking-tight">Kindred</h1>
    </div>

    <!-- Title -->
    <div id="signin-title" class="mb-8 text-center">
      <h2 class="font-semibold text-2xl text-[#EEEEEE]">Sign in</h2>
      <p class="text-sm text-[#EEEEEE]/50 mt-2">Welcome back, let's get you listening.</p>
    </div>

    <!-- Fields -->
    <form id="signin-form" class="flex flex-col gap-4">
      <div id="field-email" class="bg-[#393E46] rounded-[10px] px-4 py-3.5 flex items-center gap-3 border border-white/5 focus-within:border-[#FFD369]/50 transition-colors">
        <i class="fa-regular fa-envelope text-[#EEEEEE]/40 text-sm w-4"></i>
        <div class="flex flex-col flex-1">
          <label class="text-[10px] uppercase tracking-wide text-[#EEEEEE]/40 mb-0.5">Email</label>
          <input type="email" value="efua.boateng@kindredmail.com" placeholder="Enter your email" class="bg-transparent text-[#EEEEEE] text-sm placeholder:text-[#EEEEEE]/30 outline-none w-full">
        </div>
      </div>

      <div id="field-password" class="bg-[#393E46] rounded-[10px] px-4 py-3.5 flex items-center gap-3 border border-white/5 focus-within:border-[#FFD369]/50 transition-colors">
        <i class="fa-solid fa-lock text-[#EEEEEE]/40 text-sm w-4"></i>
        <div class="flex flex-col flex-1">
          <label class="text-[10px] uppercase tracking-wide text-[#EEEEEE]/40 mb-0.5">Password</label>
          <input id="password-input" type="password" value="kindredsound24" placeholder="Enter your password" class="bg-transparent text-[#EEEEEE] text-sm placeholder:text-[#EEEEEE]/30 outline-none w-full">
        </div>
        <button type="button" id="toggle-password" onclick="const i=document.getElementById('password-input'); const ic=document.getElementById('eye-icon'); if(i.type==='password'){i.type='text'; ic.classList.remove('fa-eye'); ic.classList.add('fa-eye-slash');}else{i.type='password'; ic.classList.remove('fa-eye-slash'); ic.classList.add('fa-eye');}" class="text-[#EEEEEE]/40 text-sm px-1">
          <i id="eye-icon" class="fa-regular fa-eye"></i>
        </button>
      </div>

      <button type="button" id="signin-btn" class="mt-4 w-full bg-[#FFD369] text-[#222831] font-semibold text-base py-4 rounded-full shadow-lg shadow-[#FFD369]/20 active:scale-[0.98] transition-transform">
        Sign in
      </button>
    </form>

    <!-- Create account link -->
    <div id="signin-footer" class="mt-6 text-center">
      <a href="#" class="text-[#FFD369] text-sm font-medium">Create account</a>
    </div>

    <!-- Helper -->
    <p id="signin-helper" class="text-center text-[11px] text-[#EEEEEE]/30 mt-8">Email and password only.</p>

  </div>
</div>
</body>
</html>
