<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .waveform-bar { width: 3px; border-radius: 2px; background: #FFD369; }
</style>
</head>
<body class="bg-[#222831]">
<div id="home-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -right-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="home-topbar" class="flex items-center justify-between px-6 pt-8 pb-2 relative z-10">
    <h1 class="font-display font-bold text-2xl text-[#EEEEEE] tracking-tight">Kindred</h1>
    <button type="button" id="home-avatar-btn" class="shrink-0">
      <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-full object-cover border-2 border-[#FFD369]/30" alt="Efua Boateng">
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="home-content" class="flex-1 overflow-y-auto px-6 pt-4 pb-56 relative z-10 flex flex-col gap-5">

    <!-- Section header -->
    <div id="updates-header" class="flex items-center justify-between">
      <h2 class="text-[#EEEEEE] font-semibold text-lg">Updates</h2>
      <button type="button" class="text-[#EEEEEE]/50 text-xs font-medium">See all</button>
    </div>

    <!-- Card A: public post + playable track -->
    <div id="card-amaara" class="bg-[#393E46] rounded-2xl p-4 flex flex-col gap-3">
      <div class="flex items-center gap-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-11 h-11 rounded-full object-cover shrink-0" alt="Amaara Mensah">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-semibold text-sm truncate">Amaara Mensah</h3>
          <p class="text-[#EEEEEE]/40 text-xs mt-0.5">2h ago · Public</p>
        </div>
        <i class="fa-solid fa-globe text-[#EEEEEE]/30 text-xs"></i>
      </div>
      <p class="text-[#EEEEEE]/80 text-sm leading-relaxed">Been sitting on this one for weeks. Finally ready to share it with you all 🎶</p>
      <div id="track-asase" class="flex items-center gap-3 bg-[#222831] rounded-xl p-2.5">
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-10 h-10 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-xs ml-0.5"></i>
        </button>
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate">Amaara Mensah</p>
        </div>
        <div class="flex items-center gap-[2px] h-5 shrink-0">
          <div class="waveform-bar h-2"></div>
          <div class="waveform-bar h-4"></div>
          <div class="waveform-bar h-3"></div>
          <div class="waveform-bar h-5"></div>
          <div class="waveform-bar h-2"></div>
        </div>
      </div>
    </div>

    <!-- Card B: supporters-only locked -->
    <div id="card-kweku" class="bg-[#393E46] rounded-2xl p-4 flex flex-col gap-3 relative overflow-hidden">
      <div class="flex items-center gap-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-11 h-11 rounded-full object-cover shrink-0" alt="Kweku Darko">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-semibold text-sm truncate">Kweku Darko</h3>
          <p class="text-[#EEEEEE]/40 text-xs mt-0.5">5h ago · Supporters only</p>
        </div>
        <i class="fa-solid fa-lock text-[#FFD369]/70 text-xs"></i>
      </div>
      <div class="rounded-xl bg-[#222831] p-5 flex flex-col items-center justify-center gap-3 text-center">
        <div class="w-11 h-11 rounded-full bg-[#FFD369]/10 flex items-center justify-center">
          <i class="fa-solid fa-lock text-[#FFD369] text-sm"></i>
        </div>
        <p class="text-[#EEEEEE]/50 text-xs max-w-[220px]">This post is exclusive to Kweku's supporters</p>
        <button type="button" class="bg-[#FFD369] text-[#222831] text-xs font-semibold px-5 py-2.5 rounded-full">Support to unlock</button>
      </div>
    </div>

    <!-- Card C: voice note -->
    <div id="card-voice" class="bg-[#393E46] rounded-2xl p-4 flex flex-col gap-3">
      <div class="flex items-center gap-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-7.jpg" class="w-11 h-11 rounded-full object-cover shrink-0" alt="Sela Okoro">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-semibold text-sm truncate">Sela Okoro</h3>
          <p class="text-[#EEEEEE]/40 text-xs mt-0.5">Yesterday · Voice note</p>
        </div>
      </div>
      <div id="voice-chip" class="flex items-center gap-3 bg-[#222831] rounded-full pl-2 pr-4 py-2 w-fit max-w-full">
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-8 h-8 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-[10px] ml-0.5"></i>
        </button>
        <div class="flex items-center gap-[2px] h-4">
          <div class="waveform-bar h-1.5"></div>
          <div class="waveform-bar h-3"></div>
          <div class="waveform-bar h-2"></div>
          <div class="waveform-bar h-4"></div>
          <div class="waveform-bar h-1.5"></div>
          <div class="waveform-bar h-3"></div>
          <div class="waveform-bar h-2.5"></div>
        </div>
        <span class="text-[#EEEEEE]/50 text-xs font-medium shrink-0">0:42</span>
      </div>
    </div>

    <!-- Quiet text button -->
    <button type="button" id="make-mix-btn" class="text-[#EEEEEE]/50 text-sm font-medium self-center mt-1 mb-2">
      <i class="fa-solid fa-plus mr-1.5"></i>Make a mix
    </button>

  </div>

  <!-- Mini-player -->
  <div id="mini-player" class="glass absolute left-3 right-3 bottom-24 rounded-2xl px-3 py-2.5 flex items-center gap-3 border border-white/10 z-20">
    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-lg object-cover shrink-0" alt="Asase">
    <div class="flex-1 min-w-0">
      <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
      <p class="text-[#EEEEEE]/45 text-xs truncate">Amaara</p>
    </div>
    <button type="button" onclick="this.querySelector('i').classList.toggle('fa-pause'); this.querySelector('i').classList.toggle('fa-play');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-pause text-[#222831] text-xs"></i>
    </button>
  </div>

  <!-- Tab bar -->
  <div id="tab-bar" class="glass absolute left-3 right-3 bottom-6 rounded-full px-2 py-2 flex items-center justify-between border border-white/10 z-20">
    <button type="button" id="tab-home" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full bg-[#FFD369]/15">
      <i class="fa-solid fa-house text-[#FFD369] text-base"></i>
      <span class="text-[#FFD369] text-[10px] font-semibold">Home</span>
    </button>
    <button type="button" id="tab-discover" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-compass text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Discover</span>
    </button>
    <button type="button" id="tab-search" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-magnifying-glass text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Search</span>
    </button>
    <button type="button" id="tab-library" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-book-bookmark text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Library</span>
    </button>
  </div>

</div>
</body>
</html>
