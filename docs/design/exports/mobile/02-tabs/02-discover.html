<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discover</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-[#222831]">
<div id="discover-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -left-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="discover-topbar" class="flex items-center justify-between px-6 pt-8 pb-2 relative z-10">
    <h1 class="font-display font-bold text-2xl text-[#EEEEEE] tracking-tight">Discover</h1>
    <button type="button" id="discover-avatar-btn" class="shrink-0">
      <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-full object-cover border-2 border-[#FFD369]/30" alt="Efua Boateng">
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="discover-content" class="flex-1 overflow-y-auto px-6 pt-4 pb-56 relative z-10 flex flex-col gap-6">

    <!-- Featured hero -->
    <div id="featured-hero" class="relative rounded-3xl overflow-hidden h-[420px]">
      <img class="absolute inset-0 w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_50b390ca3b_0125c0b5b654cf22.png" alt="Amapiano artist portrait, moody golden-hour lighting, editorial music photography, warm tones" />
      <div class="absolute inset-0 bg-gradient-to-t from-[#222831] via-[#222831]/30 to-transparent"></div>
      <div class="absolute top-4 left-4 bg-[#FFD369] text-[#222831] text-[10px] font-bold uppercase tracking-wide px-3 py-1.5 rounded-full">Featured</div>
      <div class="absolute bottom-0 left-0 right-0 p-5 flex flex-col gap-3">
        <div>
          <h2 class="text-[#EEEEEE] font-display font-bold text-2xl">Sela Okoro</h2>
          <p class="text-[#EEEEEE]/60 text-sm mt-1">Amapiano · Lagos</p>
        </div>
        <div class="flex items-center gap-3">
          <button type="button" onclick="this.textContent = this.textContent.trim()==='Follow' ? 'Following' : 'Follow';" class="bg-[#FFD369] text-[#222831] font-semibold text-sm px-6 py-3 rounded-full">Follow</button>
          <button type="button" class="w-11 h-11 rounded-full bg-white/10 border border-white/20 flex items-center justify-center backdrop-blur-sm">
            <i class="fa-solid fa-play text-[#EEEEEE] text-sm ml-0.5"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Rising artists -->
    <div id="rising-section" class="flex flex-col gap-3">
      <h2 class="text-[#EEEEEE] font-semibold text-lg">Rising artists</h2>
      <div id="rising-scroll" class="flex gap-4 overflow-x-auto no-scrollbar -mx-6 px-6 pb-1">

        <div id="rising-amaara" class="flex flex-col items-center gap-2.5 shrink-0 w-[92px]">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-20 h-20 rounded-full object-cover" alt="Amaara Mensah">
          <p class="text-[#EEEEEE] text-xs font-medium text-center truncate w-full">Amaara</p>
          <button type="button" onclick="this.textContent = this.textContent.trim()==='Follow' ? 'Following' : 'Follow';" class="bg-transparent text-[#FFD369] border border-[#EEEEEE]/20 text-[11px] font-semibold px-3.5 py-1.5 rounded-full w-full">Follow</button>
        </div>

        <div id="rising-kweku" class="flex flex-col items-center gap-2.5 shrink-0 w-[92px]">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-20 h-20 rounded-full object-cover" alt="Kweku Darko">
          <p class="text-[#EEEEEE] text-xs font-medium text-center truncate w-full">Kweku</p>
          <button type="button" onclick="this.textContent = this.textContent.trim()==='Follow' ? 'Following' : 'Follow';" class="bg-transparent text-[#FFD369] border border-[#EEEEEE]/20 text-[11px] font-semibold px-3.5 py-1.5 rounded-full w-full">Follow</button>
        </div>

        <div id="rising-tewa" class="flex flex-col items-center gap-2.5 shrink-0 w-[92px]">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-6.jpg" class="w-20 h-20 rounded-full object-cover" alt="Téwá Nkrumah">
          <p class="text-[#EEEEEE] text-xs font-medium text-center truncate w-full">Téwá</p>
          <button type="button" onclick="this.textContent = this.textContent.trim()==='Follow' ? 'Following' : 'Follow';" class="bg-transparent text-[#FFD369] border border-[#EEEEEE]/20 text-[11px] font-semibold px-3.5 py-1.5 rounded-full w-full">Follow</button>
        </div>

        <div id="rising-leye" class="flex flex-col items-center gap-2.5 shrink-0 w-[92px]">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-20 h-20 rounded-full object-cover" alt="Leye Ade">
          <p class="text-[#EEEEEE] text-xs font-medium text-center truncate w-full">Leye</p>
          <button type="button" onclick="this.textContent = this.textContent.trim()==='Follow' ? 'Following' : 'Follow';" class="bg-transparent text-[#FFD369] border border-[#EEEEEE]/20 text-[11px] font-semibold px-3.5 py-1.5 rounded-full w-full">Follow</button>
        </div>

      </div>
    </div>

    <!-- Genres to explore -->
    <div id="genres-section" class="flex flex-col gap-3">
      <h2 class="text-[#EEEEEE] font-semibold text-lg">Explore genres</h2>
      <div class="grid grid-cols-2 gap-3">
        <div id="genre-afrosoul" class="bg-[#393E46] rounded-2xl p-4 h-20 flex items-end">
          <p class="text-[#EEEEEE] font-semibold text-sm">Afro-soul</p>
        </div>
        <div id="genre-amapiano" class="bg-[#393E46] rounded-2xl p-4 h-20 flex items-end">
          <p class="text-[#EEEEEE] font-semibold text-sm">Amapiano</p>
        </div>
        <div id="genre-highlife" class="bg-[#393E46] rounded-2xl p-4 h-20 flex items-end">
          <p class="text-[#EEEEEE] font-semibold text-sm">Highlife</p>
        </div>
        <div id="genre-gospel" class="bg-[#393E46] rounded-2xl p-4 h-20 flex items-end">
          <p class="text-[#EEEEEE] font-semibold text-sm">Gospel</p>
        </div>
      </div>
    </div>

  </div>

  <!-- Mini-player -->
  <div id="mini-player" class="glass absolute left-3 right-3 bottom-24 rounded-2xl px-3 py-2.5 flex items-center gap-3 border border-white/10 z-20">
    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-lg object-cover shrink-0" alt="Asase">
    <div class="flex-1 min-w-0">
      <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
      <p class="text-[#EEEEEE]/45 text-xs truncate">Amaara</p>
    </div>
    <button type="button" onclick="this.querySelector('i').classList.toggle('fa-pause'); this.querySelector('i').classList.toggle('fa-play');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-pause text-[#222831] text-xs"></i>
    </button>
  </div>

  <!-- Tab bar -->
  <div id="tab-bar" class="glass absolute left-3 right-3 bottom-6 rounded-full px-2 py-2 flex items-center justify-between border border-white/10 z-20">
    <button type="button" id="tab-home" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-house text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Home</span>
    </button>
    <button type="button" id="tab-discover" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full bg-[#FFD369]/15">
      <i class="fa-solid fa-compass text-[#FFD369] text-base"></i>
      <span class="text-[#FFD369] text-[10px] font-semibold">Discover</span>
    </button>
    <button type="button" id="tab-search" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-magnifying-glass text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Search</span>
    </button>
    <button type="button" id="tab-library" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-book-bookmark text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Library</span>
    </button>
  </div>

</div>
</body>
</html>
