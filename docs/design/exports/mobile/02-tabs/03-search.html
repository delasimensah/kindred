<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
  .glass-input {
    background: rgba(57,62,70,0.55);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="search-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -right-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="search-topbar" class="px-6 pt-8 pb-3 relative z-10">
    <h1 class="font-display font-bold text-2xl text-[#EEEEEE] tracking-tight mb-4">Search</h1>

    <!-- Frosted glass search capsule -->
    <div id="search-field" class="glass-input rounded-full px-4 py-3.5 flex items-center gap-3 border border-white/10">
      <i class="fa-solid fa-magnifying-glass text-[#EEEEEE]/40 text-sm"></i>
      <input type="text" value="amaara" placeholder="Artists and tracks" class="bg-transparent text-[#EEEEEE] text-sm placeholder:text-[#EEEEEE]/35 outline-none flex-1">
      <button type="button" class="text-[#EEEEEE]/40 text-sm">
        <i class="fa-solid fa-circle-xmark"></i>
      </button>
    </div>
  </div>

  <!-- Scrollable content -->
  <div id="search-content" class="flex-1 overflow-y-auto px-6 pt-2 pb-56 relative z-10 flex flex-col gap-6">

    <!-- Top results -->
    <div id="top-results-section" class="flex flex-col gap-3">
      <h2 class="text-[#EEEEEE]/50 text-xs font-semibold uppercase tracking-wide">Top results</h2>

      <!-- Artist result -->
      <div id="result-artist-amaara" class="flex items-center gap-3.5 bg-[#393E46] rounded-2xl p-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-14 h-14 rounded-full object-cover shrink-0" alt="Amaara Mensah">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-semibold text-[15px] truncate">Amaara Mensah</h3>
          <p class="text-[#EEEEEE]/45 text-xs mt-0.5 truncate">Artist · Afro-soul</p>
        </div>
        <button type="button" onclick="this.textContent = this.textContent.trim()==='Follow' ? 'Following' : 'Follow';" class="shrink-0 bg-transparent text-[#FFD369] border border-[#EEEEEE]/20 text-xs font-semibold px-4 py-2 rounded-full">Follow</button>
      </div>

      <!-- Track rows -->
      <div id="result-track-asase" class="flex items-center gap-3.5 bg-[#393E46] rounded-2xl p-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-12 h-12 rounded-xl object-cover shrink-0" alt="Asase">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-medium text-sm truncate">Asase</h3>
          <p class="text-[#EEEEEE]/45 text-xs mt-0.5 truncate">Amaara Mensah · Track</p>
        </div>
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-xs ml-0.5"></i>
        </button>
        <button type="button" class="text-[#EEEEEE]/40 px-1 shrink-0">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>

      <div id="result-track-obra" class="flex items-center gap-3.5 bg-[#393E46] rounded-2xl p-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-12 h-12 rounded-xl object-cover shrink-0" alt="Obra">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-medium text-sm truncate">Obra</h3>
          <p class="text-[#EEEEEE]/45 text-xs mt-0.5 truncate">Amaara Mensah · Track</p>
        </div>
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-xs ml-0.5"></i>
        </button>
        <button type="button" class="text-[#EEEEEE]/40 px-1 shrink-0">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>
    </div>

    <!-- Related section -->
    <div id="related-section" class="flex flex-col gap-3">
      <h2 class="text-[#EEEEEE]/50 text-xs font-semibold uppercase tracking-wide">Related</h2>

      <div id="related-track-kweku" class="flex items-center gap-3.5 bg-[#393E46] rounded-2xl p-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-12 h-12 rounded-xl object-cover shrink-0" alt="Odo">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-medium text-sm truncate">Odo</h3>
          <p class="text-[#EEEEEE]/45 text-xs mt-0.5 truncate">Kweku Darko · Track</p>
        </div>
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-xs ml-0.5"></i>
        </button>
        <button type="button" class="text-[#EEEEEE]/40 px-1 shrink-0">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>

      <div id="related-track-tewa" class="flex items-center gap-3.5 bg-[#393E46] rounded-2xl p-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-6.jpg" class="w-12 h-12 rounded-xl object-cover shrink-0" alt="Grace">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-medium text-sm truncate">Grace</h3>
          <p class="text-[#EEEEEE]/45 text-xs mt-0.5 truncate">Téwá Nkrumah · Track</p>
        </div>
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-xs ml-0.5"></i>
        </button>
        <button type="button" class="text-[#EEEEEE]/40 px-1 shrink-0">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>

      <div id="related-track-leye" class="flex items-center gap-3.5 bg-[#393E46] rounded-2xl p-3">
        <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-12 h-12 rounded-xl object-cover shrink-0" alt="Lagos Nights">
        <div class="flex-1 min-w-0">
          <h3 class="text-[#EEEEEE] font-medium text-sm truncate">Lagos Nights</h3>
          <p class="text-[#EEEEEE]/45 text-xs mt-0.5 truncate">Leye Ade · Track</p>
        </div>
        <button type="button" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-play text-[#222831] text-xs ml-0.5"></i>
        </button>
        <button type="button" class="text-[#EEEEEE]/40 px-1 shrink-0">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>
    </div>

  </div>

  <!-- Mini-player -->
  <div id="mini-player" class="glass absolute left-3 right-3 bottom-24 rounded-2xl px-3 py-2.5 flex items-center gap-3 border border-white/10 z-20">
    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-lg object-cover shrink-0" alt="Asase">
    <div class="flex-1 min-w-0">
      <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
      <p class="text-[#EEEEEE]/45 text-xs truncate">Amaara</p>
    </div>
    <button type="button" onclick="this.querySelector('i').classList.toggle('fa-pause'); this.querySelector('i').classList.toggle('fa-play');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-pause text-[#222831] text-xs"></i>
    </button>
  </div>

  <!-- Tab bar -->
  <div id="tab-bar" class="glass absolute left-3 right-3 bottom-6 rounded-full px-2 py-2 flex items-center justify-between border border-white/10 z-20">
    <button type="button" id="tab-home" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-house text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Home</span>
    </button>
    <button type="button" id="tab-discover" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-compass text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Discover</span>
    </button>
    <button type="button" id="tab-search" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full bg-[#FFD369]/15">
      <i class="fa-solid fa-magnifying-glass text-[#FFD369] text-base"></i>
      <span class="text-[#FFD369] text-[10px] font-semibold">Search</span>
    </button>
    <button type="button" id="tab-library" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-book-bookmark text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Library</span>
    </button>
  </div>

</div>
</body>
</html>
