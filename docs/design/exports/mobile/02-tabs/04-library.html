<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="library-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -left-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="library-topbar" class="flex items-center justify-between px-6 pt-8 pb-4 relative z-10">
    <h1 class="font-display font-bold text-[32px] text-[#EEEEEE] tracking-tight">Library</h1>
    <button type="button" id="library-avatar-btn" class="shrink-0">
      <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-full object-cover border-2 border-[#FFD369]/30" alt="Efua Boateng">
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="library-content" class="flex-1 overflow-y-auto px-6 pt-2 pb-56 relative z-10 flex flex-col gap-3">

    <button type="button" id="row-playlists" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-4 w-full text-left">
      <div class="w-12 h-12 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-record-vinyl text-[#FFD369] text-lg"></i>
      </div>
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px]">Playlists</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="row-liked" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-4 w-full text-left">
      <div class="w-12 h-12 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-heart text-[#FFD369] text-lg"></i>
      </div>
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px]">Liked songs</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="row-downloaded" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-4 w-full text-left">
      <div class="w-12 h-12 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-arrow-down text-[#FFD369] text-lg"></i>
      </div>
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px]">Downloaded</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="row-artists" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-4 w-full text-left">
      <div class="w-12 h-12 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-user-music text-[#FFD369] text-lg"></i>
      </div>
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px]">Artists</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="row-make-mix" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-4 w-full text-left">
      <div class="w-12 h-12 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-plus text-[#FFD369] text-lg"></i>
      </div>
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px]">Make a mix</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

  </div>

  <!-- Mini-player -->
  <div id="mini-player" class="glass absolute left-3 right-3 bottom-24 rounded-2xl px-3 py-2.5 flex items-center gap-3 border border-white/10 z-20">
    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-lg object-cover shrink-0" alt="Asase">
    <div class="flex-1 min-w-0">
      <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
      <p class="text-[#EEEEEE]/45 text-xs truncate">Amaara</p>
    </div>
    <button type="button" onclick="this.querySelector('i').classList.toggle('fa-pause'); this.querySelector('i').classList.toggle('fa-play');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-pause text-[#222831] text-xs"></i>
    </button>
  </div>

  <!-- Tab bar -->
  <div id="tab-bar" class="glass absolute left-3 right-3 bottom-6 rounded-full px-2 py-2 flex items-center justify-between border border-white/10 z-20">
    <button type="button" id="tab-home" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-house text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Home</span>
    </button>
    <button type="button" id="tab-discover" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-compass text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Discover</span>
    </button>
    <button type="button" id="tab-search" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full">
      <i class="fa-solid fa-magnifying-glass text-[#EEEEEE]/50 text-base"></i>
      <span class="text-[#EEEEEE]/50 text-[10px] font-medium">Search</span>
    </button>
    <button type="button" id="tab-library" class="flex-1 flex flex-col items-center gap-1 py-2 rounded-full bg-[#FFD369]/15">
      <i class="fa-solid fa-book-bookmark text-[#FFD369] text-base"></i>
      <span class="text-[#FFD369] text-[10px] font-semibold">Library</span>
    </button>
  </div>

</div>
</body>
</html>
