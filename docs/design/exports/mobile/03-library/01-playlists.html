<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlists</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="playlists-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -left-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="playlists-topbar" class="flex items-center gap-4 px-6 pt-8 pb-4 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
    <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight flex-1">Playlists</h1>
  </div>

  <!-- Create playlist CTA -->
  <div class="px-6 pb-4 relative z-10">
    <button type="button" id="create-playlist-btn" class="w-full flex items-center justify-center gap-2 bg-[#FFD369] text-[#222831] font-semibold text-sm rounded-full py-3.5">
      <i class="fa-solid fa-plus text-xs"></i>
      Create playlist
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="playlists-content" class="flex-1 overflow-y-auto px-6 pt-1 pb-10 relative z-10 flex flex-col gap-3">

    <p id="playlists-count" class="text-[#EEEEEE]/40 text-xs font-medium uppercase tracking-wide mb-1">4 playlists</p>

    <button type="button" id="playlist-highlife-heat" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-14 h-14 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_bd5e23027c_7a597d39aeb1494f.png" alt="warm golden abstract album cover art, highlife music mood, textured gradient" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] font-semibold text-[15px] truncate">Highlife Heat</p>
        <p class="text-[#EEEEEE]/40 text-xs mt-1 flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
          Resets Sunday · 24 tracks
        </p>
      </div>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="playlist-late-night" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-14 h-14 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_23c55f92f7_e9c64b7f76aa3d38.png" alt="deep blue and amber abstract album cover art, late night mood, textured gradient" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] font-semibold text-[15px] truncate">Late Night Amapiano</p>
        <p class="text-[#EEEEEE]/40 text-xs mt-1">18 tracks</p>
      </div>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="playlist-soft-mornings" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-14 h-14 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_706e9bd86e_6d96d8fb73577e1c.png" alt="soft pastel abstract album cover art, morning light mood, textured gradient" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] font-semibold text-[15px] truncate">Soft Mornings</p>
        <p class="text-[#EEEEEE]/40 text-xs mt-1 flex items-center gap-1.5">
          <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
          Resets Sunday · 12 tracks
        </p>
      </div>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="playlist-road-trip" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-14 h-14 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_a0024e0ed6_da04196854be3c30.png" alt="dusty orange abstract album cover art, road trip mood, textured gradient" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] font-semibold text-[15px] truncate">Road Trip Mix</p>
        <p class="text-[#EEEEEE]/40 text-xs mt-1">31 tracks</p>
      </div>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

  </div>

</div>
</body>
</html>
