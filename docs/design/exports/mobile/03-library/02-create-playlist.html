<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Playlist</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]/40">
<div id="create-playlist-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] flex flex-col justify-end relative overflow-hidden">

  <!-- Scrim -->
  <div id="scrim" class="absolute inset-0 bg-black/50"></div>

  <!-- Sheet -->
  <div id="create-playlist-sheet" class="relative z-10 bg-[#222831] rounded-t-[28px] px-6 pt-3 pb-10 flex flex-col gap-6">

    <!-- Grabber -->
    <div class="w-10 h-1.5 rounded-full bg-[#EEEEEE]/15 mx-auto"></div>

    <!-- Header -->
    <div id="sheet-header" class="flex items-center justify-between">
      <button type="button" id="cancel-btn" class="text-[#EEEEEE]/50 text-sm font-medium">Cancel</button>
      <h1 class="font-display font-bold text-lg text-[#EEEEEE] tracking-tight">New playlist</h1>
      <div class="w-[52px]"></div>
    </div>

    <!-- Cover placeholder -->
    <div id="cover-picker" class="flex flex-col items-center gap-3">
      <button type="button" class="w-28 h-28 rounded-2xl bg-[#393E46] border border-dashed border-[#EEEEEE]/15 flex items-center justify-center">
        <i class="fa-solid fa-image text-[#EEEEEE]/30 text-2xl"></i>
      </button>
      <p class="text-[#EEEEEE]/35 text-xs">Add a cover (optional)</p>
    </div>

    <!-- Name field -->
    <div id="name-field" class="flex flex-col gap-2">
      <label for="playlist-name-input" class="text-[#EEEEEE]/60 text-xs font-semibold uppercase tracking-wide">Name</label>
      <input id="playlist-name-input" type="text" placeholder="My playlist" class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-[15px] rounded-2xl px-4 py-4 outline-none focus:ring-2 focus:ring-[#FFD369]/40">
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-3 mt-2">
      <button type="button" id="create-btn" class="w-full bg-[#FFD369] text-[#222831] font-semibold text-sm rounded-full py-4">Create</button>
      <button type="button" id="cancel-btn-2" class="w-full text-[#EEEEEE]/50 font-medium text-sm rounded-full py-2">Cancel</button>
    </div>

  </div>

</div>
</body>
</html>
