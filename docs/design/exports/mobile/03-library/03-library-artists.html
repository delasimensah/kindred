<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library artists</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="library-artists-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -left-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="artists-topbar" class="flex items-center gap-4 px-6 pt-8 pb-4 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
    <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight flex-1">Library artists</h1>
  </div>

  <!-- Section label -->
  <div class="px-6 pt-1 pb-2 relative z-10">
    <p id="artists-count" class="text-[#EEEEEE]/40 text-xs font-medium uppercase tracking-wide">Artists · 5 followed</p>
  </div>

  <!-- Scrollable content -->
  <div id="artists-content" class="flex-1 overflow-y-auto px-6 pt-1 pb-10 relative z-10 flex flex-col gap-2">

    <button type="button" id="artist-row-amaara" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-12 h-12 rounded-full object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" alt="Amaara Mensah">
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px] truncate">Amaara Mensah</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="artist-row-kweku" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-12 h-12 rounded-full object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" alt="Kweku Darko">
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px] truncate">Kweku Darko</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="artist-row-sela" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-12 h-12 rounded-full object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-7.jpg" alt="Sela Okoro">
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px] truncate">Sela Okoro</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="artist-row-tewa" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-12 h-12 rounded-full object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" alt="Téwá Nkrumah">
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px] truncate">Téwá Nkrumah</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

    <button type="button" id="artist-row-leye" class="flex items-center gap-4 bg-[#393E46] rounded-2xl p-3 w-full text-left">
      <img class="w-12 h-12 rounded-full object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" alt="Leye Ade">
      <span class="flex-1 text-[#EEEEEE] font-semibold text-[15px] truncate">Leye Ade</span>
      <i class="fa-solid fa-chevron-right text-[#EEEEEE]/30 text-sm"></i>
    </button>

  </div>

</div>
</body>
</html>
