<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Detail</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="track-detail-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -right-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="track-topbar" class="flex items-center justify-between px-6 pt-8 pb-2 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
    <button type="button" id="more-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-ellipsis text-[#EEEEEE] text-sm"></i>
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="track-content" class="flex-1 overflow-y-auto px-6 pt-4 pb-10 relative z-10 flex flex-col gap-6">

    <!-- Artwork -->
    <div id="track-artwork" class="rounded-3xl overflow-hidden aspect-square w-full shadow-2xl">
      <img class="w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_bd5e23027c_242b02f5e48a4c35.png" alt="warm golden abstract album cover art, highlife music mood, textured gradient, editorial" />
    </div>

    <!-- Title + artist -->
    <div id="track-meta" class="flex items-center justify-between">
      <div class="min-w-0">
        <h1 class="font-display font-bold text-2xl text-[#EEEEEE] tracking-tight truncate">Asase</h1>
        <div class="flex items-center gap-2 mt-1.5">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-5 h-5 rounded-full object-cover" alt="Amaara Mensah">
          <p class="text-[#EEEEEE]/60 text-sm truncate">Amaara Mensah</p>
          <span class="text-[#EEEEEE]/30 text-xs">·</span>
          <i class="fa-solid fa-globe text-[#EEEEEE]/30 text-xs"></i>
          <p class="text-[#EEEEEE]/40 text-xs">Public</p>
        </div>
      </div>
      <button type="button" id="like-btn-inline" onclick="this.querySelector('i').classList.toggle('fa-regular'); this.querySelector('i').classList.toggle('fa-solid'); this.classList.toggle('text-[#FFD369]');" class="w-11 h-11 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
        <i class="fa-regular fa-heart text-[#EEEEEE] text-base"></i>
      </button>
    </div>

    <!-- Progress -->
    <div id="progress-section" class="flex flex-col gap-2">
      <div class="w-full h-1.5 rounded-full bg-[#393E46] relative overflow-hidden">
        <div class="absolute left-0 top-0 h-full w-2/5 rounded-full bg-[#FFD369]"></div>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-[#EEEEEE]/40 text-xs">1:24</span>
        <span class="text-[#EEEEEE]/40 text-xs">3:32</span>
      </div>
    </div>

    <!-- Transport -->
    <div id="transport-section" class="flex items-center justify-center gap-8">
      <button type="button" class="text-[#EEEEEE]/50">
        <i class="fa-solid fa-backward-step text-xl"></i>
      </button>
      <button type="button" id="play-btn" onclick="this.querySelector('i').classList.toggle('fa-play'); this.querySelector('i').classList.toggle('fa-pause');" class="w-16 h-16 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
        <i class="fa-solid fa-pause text-[#222831] text-xl"></i>
      </button>
      <button type="button" class="text-[#EEEEEE]/50">
        <i class="fa-solid fa-forward-step text-xl"></i>
      </button>
    </div>

    <!-- Action row -->
    <div id="action-row" class="flex items-center justify-between px-2">
      <button type="button" id="like-btn" onclick="this.querySelector('i').classList.toggle('fa-regular'); this.querySelector('i').classList.toggle('fa-solid'); this.querySelector('i').classList.toggle('text-[#FFD369]');" class="flex flex-col items-center gap-1.5">
        <i class="fa-regular fa-heart text-[#EEEEEE] text-lg"></i>
        <span class="text-[#EEEEEE]/50 text-[11px] font-medium">Like</span>
      </button>
      <button type="button" id="add-playlist-btn" class="flex flex-col items-center gap-1.5">
        <i class="fa-solid fa-plus text-[#EEEEEE] text-lg"></i>
        <span class="text-[#EEEEEE]/50 text-[11px] font-medium">Playlist</span>
      </button>
      <button type="button" id="download-btn" onclick="this.querySelector('i').classList.toggle('fa-arrow-down'); this.querySelector('i').classList.toggle('fa-check'); this.querySelector('i').classList.toggle('text-[#FFD369]');" class="flex flex-col items-center gap-1.5">
        <i class="fa-solid fa-arrow-down text-[#EEEEEE] text-lg"></i>
        <span class="text-[#EEEEEE]/50 text-[11px] font-medium">Download</span>
      </button>
      <button type="button" id="more-actions-btn" class="flex flex-col items-center gap-1.5">
        <i class="fa-solid fa-ellipsis text-[#EEEEEE] text-lg"></i>
        <span class="text-[#EEEEEE]/50 text-[11px] font-medium">More</span>
      </button>
    </div>

    <!-- Reactions -->
    <div id="reactions-row" class="flex items-center justify-between bg-[#393E46] rounded-2xl px-3 py-3">
      <button type="button" class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl" onclick="this.classList.toggle('bg-[#222831]')">
        <span class="text-xl">🔥</span>
        <span class="text-[#EEEEEE]/40 text-[10px] font-medium">42</span>
      </button>
      <button type="button" class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl" onclick="this.classList.toggle('bg-[#222831]')">
        <span class="text-xl">❤️</span>
        <span class="text-[#EEEEEE]/40 text-[10px] font-medium">128</span>
      </button>
      <button type="button" class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl" onclick="this.classList.toggle('bg-[#222831]')">
        <span class="text-xl">🙌</span>
        <span class="text-[#EEEEEE]/40 text-[10px] font-medium">19</span>
      </button>
      <button type="button" class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl" onclick="this.classList.toggle('bg-[#222831]')">
        <span class="text-xl">👏</span>
        <span class="text-[#EEEEEE]/40 text-[10px] font-medium">64</span>
      </button>
      <button type="button" class="flex-1 flex flex-col items-center gap-1 py-1 rounded-xl" onclick="this.classList.toggle('bg-[#222831]')">
        <span class="text-xl">✨</span>
        <span class="text-[#EEEEEE]/40 text-[10px] font-medium">27</span>
      </button>
    </div>

    <!-- Release note -->
    <div id="release-note" class="flex flex-col gap-2">
      <h2 class="text-[#EEEEEE] font-semibold text-sm">About this release</h2>
      <p class="text-[#EEEEEE]/60 text-sm leading-relaxed">Been sitting on this one for weeks. "Asase" means "earth" — a tribute to home, recorded live with the horn section in Accra. Finally ready to share it with you all 🎶</p>
    </div>

  </div>

</div>
</body>
</html>
