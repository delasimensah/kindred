<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downloads</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="downloads-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -left-20 w-64 h-64 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="downloads-topbar" class="flex items-center gap-4 px-6 pt-8 pb-4 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
    <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight flex-1">Downloads</h1>
  </div>

  <!-- Storage card -->
  <div id="storage-card" class="px-6 pb-4 relative z-10">
    <div class="bg-[#393E46] rounded-2xl p-4 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-hard-drive text-[#FFD369] text-sm"></i>
          </div>
          <p class="text-[#EEEEEE] text-sm font-semibold">124 MB on this phone</p>
        </div>
        <span class="text-[#EEEEEE]/40 text-xs">12 tracks</span>
      </div>
      <div class="w-full h-1.5 rounded-full bg-[#222831] overflow-hidden">
        <div class="h-full bg-[#FFD369] rounded-full" style="width: 18%"></div>
      </div>
    </div>
  </div>

  <!-- Section label + settings row -->
  <div id="download-settings-row" class="flex items-center justify-between px-6 pb-3 relative z-10">
    <p class="text-[#EEEEEE]/40 text-xs font-medium uppercase tracking-wide">Downloaded tracks</p>
    <button type="button" id="wifi-only-toggle" class="flex items-center gap-2">
      <span class="text-[#EEEEEE]/50 text-xs font-medium">Wi-Fi only</span>
      <span class="w-9 h-5 rounded-full bg-[#FFD369] flex items-center px-0.5 justify-end">
        <span class="w-4 h-4 rounded-full bg-[#222831]"></span>
      </span>
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="downloads-track-list" class="flex-1 overflow-y-auto px-6 pt-1 pb-10 relative z-10 flex flex-col gap-2">

    <div id="download-track-1" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full">
      <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_bd5e23027c_2ae60b3f25f046e1.png" alt="warm golden abstract album cover art, highlife music mood" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
        <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Amaara Mensah · 9.2 MB</p>
      </div>
      <button type="button" class="text-[#FFD369] text-xs font-semibold shrink-0 px-2 py-1">Remove</button>
    </div>

    <div id="download-track-2" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full">
      <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_f9511af383_ba2e8020f1a3a2c7.png" alt="deep red abstract album cover art, highlife music mood" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-medium truncate">Nkonsonkonson</p>
        <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Amaara Mensah · 10.1 MB</p>
      </div>
      <button type="button" class="text-[#FFD369] text-xs font-semibold shrink-0 px-2 py-1">Remove</button>
    </div>

    <div id="download-track-3" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full">
      <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_706e9bd86e_6d96d8fb73577e1c.png" alt="soft pastel abstract album cover art, morning light mood" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-medium truncate">Soft Static</p>
        <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Kweku Darko · 8.4 MB</p>
      </div>
      <button type="button" class="text-[#FFD369] text-xs font-semibold shrink-0 px-2 py-1">Remove</button>
    </div>

    <div id="download-track-4" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full">
      <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_a0024e0ed6_da04196854be3c30.png" alt="dusty orange abstract album cover art, road trip mood" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-medium truncate">Golden Hour</p>
        <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Sela Okoro · 7.6 MB</p>
      </div>
      <button type="button" class="text-[#FFD369] text-xs font-semibold shrink-0 px-2 py-1">Remove</button>
    </div>

    <div id="download-track-5" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full">
      <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_7030cbfb79_7d46d363fd86e61b.png" alt="dark purple abstract album cover art, night mood" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-medium truncate">Late Return</p>
        <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Téwá Nkrumah · 11.3 MB</p>
      </div>
      <button type="button" class="text-[#FFD369] text-xs font-semibold shrink-0 px-2 py-1">Remove</button>
    </div>

    <div id="download-track-6" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full">
      <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_23c55f92f7_e9c64b7f76aa3d38.png" alt="deep blue and amber abstract album cover art, late night mood" />
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-medium truncate">Slow Drums</p>
        <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Leye Ade · 9.8 MB</p>
      </div>
      <button type="button" class="text-[#FFD369] text-xs font-semibold shrink-0 px-2 py-1">Remove</button>
    </div>

  </div>

</div>
</body>
</html>
