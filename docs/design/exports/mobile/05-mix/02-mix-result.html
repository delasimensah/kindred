<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mix result</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="mix-result-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Scrollable content -->
  <div id="mix-result-content" class="flex-1 overflow-y-auto pb-32 relative z-10">

    <!-- Header -->
    <div id="mix-header" class="relative px-6 pt-8 pb-6">
      <div class="absolute -top-20 -left-16 w-64 h-64 bg-[#FFD369]/15 rounded-full blur-3xl pointer-events-none"></div>

      <div class="flex items-center justify-between relative z-10">
        <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
        </button>
        <button type="button" id="more-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
          <i class="fa-solid fa-ellipsis text-[#EEEEEE] text-sm"></i>
        </button>
      </div>

      <div class="flex flex-col items-center gap-4 mt-6 relative z-10">
        <div class="w-40 h-40 rounded-2xl overflow-hidden shadow-2xl shadow-black/40">
          <img class="w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_23c55f92f7_e9c64b7f76aa3d38.png" alt="warm dusky abstract album cover art, Accra evening mood, textured gradient with amber and deep blue" />
        </div>
        <div class="flex flex-col items-center gap-2 text-center">
          <span id="mix-chip" class="bg-[#FFD369]/12 text-[#FFD369] text-[10px] font-bold uppercase tracking-wide px-2.5 py-1 rounded-full">Your mix</span>
          <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight leading-tight">Accra Evenings</h1>
          <p id="mix-why" class="text-[#EEEEEE]/50 text-sm max-w-[280px] leading-relaxed">Warm Accra evenings with soft drums — built from artists you follow.</p>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div id="mix-actions" class="flex items-center gap-3 px-6 pb-6">
      <button type="button" id="play-all-btn" class="flex-1 flex items-center justify-center gap-2 bg-[#FFD369] text-[#222831] font-semibold text-sm rounded-full py-3.5">
        <i class="fa-solid fa-play text-xs"></i>
        Play all
      </button>
      <button type="button" id="shuffle-btn" class="w-12 h-12 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
        <i class="fa-solid fa-shuffle text-[#FFD369] text-sm"></i>
      </button>
      <button type="button" id="save-mix-btn" class="w-12 h-12 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
        <i class="fa-regular fa-bookmark text-[#EEEEEE] text-sm"></i>
      </button>
    </div>

    <!-- Track list -->
    <div id="mix-track-list" class="flex flex-col gap-2 px-6">

      <button type="button" id="mix-track-1" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full text-left">
        <span class="w-5 text-center text-[#FFD369] text-xs font-semibold shrink-0">1</span>
        <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_bd5e23027c_2ae60b3f25f046e1.png" alt="warm golden abstract album cover art, highlife music mood" />
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Amaara Mensah</p>
        </div>
        <span class="text-[#EEEEEE]/30 text-xs shrink-0">3:42</span>
      </button>

      <button type="button" id="mix-track-2" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full text-left">
        <span class="w-5 text-center text-[#EEEEEE]/40 text-xs font-semibold shrink-0">2</span>
        <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_f9511af383_ba2e8020f1a3a2c7.png" alt="deep red abstract album cover art, highlife music mood" />
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Nkonsonkonson</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Amaara Mensah</p>
        </div>
        <span class="text-[#EEEEEE]/30 text-xs shrink-0">4:05</span>
      </button>

      <button type="button" id="mix-track-3" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full text-left">
        <span class="w-5 text-center text-[#EEEEEE]/40 text-xs font-semibold shrink-0">3</span>
        <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_706e9bd86e_6d96d8fb73577e1c.png" alt="soft pastel abstract album cover art, morning light mood" />
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Soft Static</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Kweku Darko</p>
        </div>
        <span class="text-[#EEEEEE]/30 text-xs shrink-0">3:18</span>
      </button>

      <button type="button" id="mix-track-4" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full text-left">
        <span class="w-5 text-center text-[#EEEEEE]/40 text-xs font-semibold shrink-0">4</span>
        <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_a0024e0ed6_da04196854be3c30.png" alt="dusty orange abstract album cover art, road trip mood" />
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Golden Hour</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Sela Okoro</p>
        </div>
        <span class="text-[#EEEEEE]/30 text-xs shrink-0">2:56</span>
      </button>

      <button type="button" id="mix-track-5" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full text-left">
        <span class="w-5 text-center text-[#EEEEEE]/40 text-xs font-semibold shrink-0">5</span>
        <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_7030cbfb79_7d46d363fd86e61b.png" alt="dark purple abstract album cover art, night mood" />
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Late Return</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Téwá Nkrumah</p>
        </div>
        <span class="text-[#EEEEEE]/30 text-xs shrink-0">4:21</span>
      </button>

      <button type="button" id="mix-track-6" class="flex items-center gap-3 bg-[#393E46] rounded-2xl p-3 w-full text-left">
        <span class="w-5 text-center text-[#EEEEEE]/40 text-xs font-semibold shrink-0">6</span>
        <img class="w-11 h-11 rounded-xl object-cover shrink-0" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_23c55f92f7_e9c64b7f76aa3d38.png" alt="deep blue and amber abstract album cover art, late night mood" />
        <div class="flex-1 min-w-0">
          <p class="text-[#EEEEEE] text-sm font-medium truncate">Slow Drums</p>
          <p class="text-[#EEEEEE]/40 text-xs truncate mt-0.5">Leye Ade</p>
        </div>
        <span class="text-[#EEEEEE]/30 text-xs shrink-0">3:33</span>
      </button>

    </div>

  </div>

  <!-- Mini-player -->
  <div id="mini-player" class="glass absolute left-3 right-3 bottom-6 rounded-2xl px-3 py-2.5 flex items-center gap-3 border border-white/10 z-20">
    <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-lg object-cover shrink-0" alt="Asase">
    <div class="flex-1 min-w-0">
      <p class="text-[#EEEEEE] text-sm font-medium truncate">Asase</p>
      <p class="text-[#EEEEEE]/45 text-xs truncate">Amaara Mensah</p>
    </div>
    <button type="button" onclick="this.querySelector('i').classList.toggle('fa-pause'); this.querySelector('i').classList.toggle('fa-play');" class="w-9 h-9 rounded-full bg-[#FFD369] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-pause text-[#222831] text-xs"></i>
    </button>
  </div>

</div>
</body>
</html>
