<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Route Support</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="route-support-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Top bar -->
  <div id="route-topbar" class="flex items-center justify-between px-6 pt-8 pb-2 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
    <span id="counter-chip" class="bg-[#393E46] text-[#FFD369] font-semibold text-sm px-3.5 py-1.5 rounded-full">3 / 5</span>
  </div>

  <!-- Scrollable content -->
  <div id="route-content" class="flex-1 overflow-y-auto px-6 pt-4 pb-6 relative z-10 flex flex-col gap-6">

    <!-- Header -->
    <div id="route-header" class="flex flex-col gap-2">
      <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight">Route your support.</h1>
      <p class="text-[#EEEEEE]/60 text-sm leading-relaxed">Pick 1 to 5 artists you follow. Split is equal.</p>
    </div>

    <!-- Equal split callout -->
    <div id="split-callout" class="bg-[#393E46] rounded-2xl px-4 py-3.5 flex items-center gap-3">
      <div class="w-9 h-9 rounded-full bg-[#FFD369]/15 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-scale-balanced text-[#FFD369] text-sm"></i>
      </div>
      <p id="split-text" class="text-[#EEEEEE] text-sm font-medium flex-1">Each gets <span class="text-[#FFD369] font-bold">33%</span></p>
    </div>

    <!-- Artist grid -->
    <div id="artist-grid" class="grid grid-cols-3 gap-3">

      <!-- Amaara Mensah - selected -->
      <button type="button" id="artist-amaara" onclick="toggleArtist('artist-amaara')" data-selected="true" class="artist-card flex flex-col items-center gap-2 py-3 px-2 rounded-2xl bg-[#393E46] border-2 border-[#FFD369]">
        <div class="relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-14 h-14 rounded-full object-cover ring-2 ring-[#FFD369]" alt="Amaara Mensah">
          <div class="check-badge absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#FFD369] flex items-center justify-center">
            <i class="fa-solid fa-check text-[#222831] text-[10px]"></i>
          </div>
        </div>
        <p class="text-[#EEEEEE] text-xs font-medium text-center leading-tight">Amaara Mensah</p>
      </button>

      <!-- Kweku Darko - selected -->
      <button type="button" id="artist-kweku" onclick="toggleArtist('artist-kweku')" data-selected="true" class="artist-card flex flex-col items-center gap-2 py-3 px-2 rounded-2xl bg-[#393E46] border-2 border-[#FFD369]">
        <div class="relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-14 h-14 rounded-full object-cover ring-2 ring-[#FFD369]" alt="Kweku Darko">
          <div class="check-badge absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#FFD369] flex items-center justify-center">
            <i class="fa-solid fa-check text-[#222831] text-[10px]"></i>
          </div>
        </div>
        <p class="text-[#EEEEEE] text-xs font-medium text-center leading-tight">Kweku Darko</p>
      </button>

      <!-- Sela Okoro - selected -->
      <button type="button" id="artist-sela" onclick="toggleArtist('artist-sela')" data-selected="true" class="artist-card flex flex-col items-center gap-2 py-3 px-2 rounded-2xl bg-[#393E46] border-2 border-[#FFD369]">
        <div class="relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-6.jpg" class="w-14 h-14 rounded-full object-cover ring-2 ring-[#FFD369]" alt="Sela Okoro">
          <div class="check-badge absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#FFD369] flex items-center justify-center">
            <i class="fa-solid fa-check text-[#222831] text-[10px]"></i>
          </div>
        </div>
        <p class="text-[#EEEEEE] text-xs font-medium text-center leading-tight">Sela Okoro</p>
      </button>

      <!-- Not selected artists -->
      <button type="button" id="artist-nana" onclick="toggleArtist('artist-nana')" data-selected="false" class="artist-card flex flex-col items-center gap-2 py-3 px-2 rounded-2xl bg-[#393E46] border-2 border-transparent">
        <div class="relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-7.jpg" class="w-14 h-14 rounded-full object-cover" alt="Nana Adjei">
          <div class="check-badge absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#222831] border border-[#EEEEEE]/20 flex items-center justify-center opacity-0">
            <i class="fa-solid fa-check text-[#FFD369] text-[10px]"></i>
          </div>
        </div>
        <p class="text-[#EEEEEE]/60 text-xs font-medium text-center leading-tight">Nana Adjei</p>
      </button>

      <button type="button" id="artist-abena" onclick="toggleArtist('artist-abena')" data-selected="false" class="artist-card flex flex-col items-center gap-2 py-3 px-2 rounded-2xl bg-[#393E46] border-2 border-transparent">
        <div class="relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-1.jpg" class="w-14 h-14 rounded-full object-cover" alt="Abena Owusu">
          <div class="check-badge absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#222831] border border-[#EEEEEE]/20 flex items-center justify-center opacity-0">
            <i class="fa-solid fa-check text-[#FFD369] text-[10px]"></i>
          </div>
        </div>
        <p class="text-[#EEEEEE]/60 text-xs font-medium text-center leading-tight">Abena Owusu</p>
      </button>

      <button type="button" id="artist-kojo" onclick="toggleArtist('artist-kojo')" data-selected="false" class="artist-card flex flex-col items-center gap-2 py-3 px-2 rounded-2xl bg-[#393E46] border-2 border-transparent">
        <div class="relative">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-3.jpg" class="w-14 h-14 rounded-full object-cover" alt="Kojo Antwi">
          <div class="check-badge absolute -bottom-0.5 -right-0.5 w-5 h-5 rounded-full bg-[#222831] border border-[#EEEEEE]/20 flex items-center justify-center opacity-0">
            <i class="fa-solid fa-check text-[#FFD369] text-[10px]"></i>
          </div>
        </div>
        <p class="text-[#EEEEEE]/60 text-xs font-medium text-center leading-tight">Kojo Antwi</p>
      </button>
    </div>

    <!-- Unfollow lock note -->
    <div id="unfollow-note" class="flex items-start gap-3 px-1">
      <i class="fa-solid fa-circle-info text-[#EEEEEE]/30 text-sm mt-0.5"></i>
      <p class="text-[#EEEEEE]/40 text-xs leading-relaxed flex-1">Unfollow is blocked while an artist is routed — remove them here first.</p>
    </div>

  </div>

  <!-- Sticky CTA -->
  <div id="route-cta-bar" class="px-6 pt-3 pb-8 bg-gradient-to-t from-[#222831] via-[#222831] to-transparent relative z-10">
    <button type="button" id="save-routing-btn" class="w-full bg-[#FFD369] text-[#222831] font-bold text-base rounded-full py-4 text-center">Save routing</button>
  </div>

</div>
<script>
  const MAX_SELECTED = 5;

  function countSelected() {
    return document.querySelectorAll('.artist-card[data-selected="true"]').length;
  }

  function updateSplitUI() {
    const count = countSelected();
    const counterChip = document.getElementById('counter-chip');
    const splitText = document.getElementById('split-text');
    const saveBtn = document.getElementById('save-routing-btn');
    counterChip.textContent = count + ' / ' + MAX_SELECTED;

    if (count === 0) {
      splitText.innerHTML = 'Select at least 1 artist to route your support';
      saveBtn.disabled = true;
      saveBtn.classList.add('opacity-40');
    } else {
      const pct = Math.floor(100 / count);
      splitText.innerHTML = 'Each gets <span class="text-[#FFD369] font-bold">' + pct + '%</span>';
      saveBtn.disabled = false;
      saveBtn.classList.remove('opacity-40');
    }
  }

  function toggleArtist(id) {
    const el = document.getElementById(id);
    const isSelected = el.getAttribute('data-selected') === 'true';
    const badge = el.querySelector('.check-badge');
    const img = el.querySelector('img');
    const label = el.querySelector('p');

    if (!isSelected && countSelected() >= MAX_SELECTED) return;

    if (isSelected) {
      el.setAttribute('data-selected', 'false');
      el.classList.remove('border-[#FFD369]');
      el.classList.add('border-transparent');
      badge.classList.add('opacity-0');
      badge.classList.remove('bg-[#FFD369]');
      badge.classList.add('bg-[#222831]', 'border', 'border-[#EEEEEE]/20');
      badge.querySelector('i').classList.remove('text-[#222831]');
      badge.querySelector('i').classList.add('text-[#FFD369]');
      img.classList.remove('ring-2', 'ring-[#FFD369]');
      label.classList.remove('text-[#EEEEEE]');
      label.classList.add('text-[#EEEEEE]/60');
    } else {
      el.setAttribute('data-selected', 'true');
      el.classList.remove('border-transparent');
      el.classList.add('border-[#FFD369]');
      badge.classList.remove('opacity-0');
      badge.classList.remove('bg-[#222831]', 'border', 'border-[#EEEEEE]/20');
      badge.classList.add('bg-[#FFD369]');
      badge.querySelector('i').classList.add('text-[#222831]');
      badge.querySelector('i').classList.remove('text-[#FFD369]');
      img.classList.add('ring-2', 'ring-[#FFD369]');
      label.classList.add('text-[#EEEEEE]');
      label.classList.remove('text-[#EEEEEE]/60');
    }
    updateSplitUI();
  }

  updateSplitUI();
</script>
</body>
</html>
