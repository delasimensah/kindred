<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
  .glass {
    background: rgba(57,62,70,0.65);
    backdrop-filter: blur(20px) saturate(160%);
    -webkit-backdrop-filter: blur(20px) saturate(160%);
  }
</style>
</head>
<body class="bg-[#222831]">
<div id="thank-you-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Full-bleed artwork -->
  <img class="absolute inset-0 w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_bd5e23027c_242b02f5e48a4c35.png" alt="warm golden abstract album cover art, highlife music mood, textured gradient, editorial">

  <!-- Soft gradient overlay -->
  <div class="absolute inset-0 bg-gradient-to-b from-[#222831]/70 via-[#222831]/50 to-[#222831]/95"></div>
  <div class="absolute inset-0 bg-gradient-to-t from-[#222831] via-transparent to-transparent"></div>

  <!-- Close -->
  <button type="button" id="close-btn" class="absolute top-8 right-6 w-9 h-9 rounded-full glass border border-white/10 flex items-center justify-center z-20">
    <i class="fa-solid fa-xmark text-[#EEEEEE] text-sm"></i>
  </button>

  <!-- Content -->
  <div id="thank-you-content" class="relative z-10 flex-1 flex flex-col justify-end px-7 pb-14 pt-8">

    <div class="flex flex-col items-center text-center gap-5">

      <!-- Artist avatar -->
      <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-20 h-20 rounded-full object-cover ring-4 ring-[#FFD369]/80 shadow-xl" alt="Amaara Mensah">

      <div class="flex flex-col gap-3">
        <h1 class="font-display font-bold text-[34px] text-[#EEEEEE] leading-tight tracking-tight">Thank you, Efua</h1>
        <p class="text-[#EEEEEE]/85 text-base leading-relaxed max-w-[300px] mx-auto">"Your support helped me finish <span class="italic">Asase</span>." — Amaara</p>
      </div>

      <!-- Actions -->
      <div id="thank-you-actions" class="flex items-center gap-3 w-full pt-3">
        <button type="button" id="share-btn" class="flex-1 bg-[#393E46]/80 border border-white/10 text-[#EEEEEE] font-semibold text-sm rounded-full py-3.5 flex items-center justify-center gap-2">
          <i class="fa-solid fa-share-nodes text-[#FFD369] text-sm"></i>
          Share
        </button>
        <button type="button" id="continue-btn" class="flex-1 bg-[#FFD369] text-[#222831] font-bold text-sm rounded-full py-3.5 text-center">Continue</button>
      </div>
    </div>

  </div>

</div>
</body>
</html>
