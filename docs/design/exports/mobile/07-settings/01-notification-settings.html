<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notification Settings</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="notification-settings-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -right-16 w-72 h-72 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="notif-topbar" class="flex items-center gap-4 px-6 pt-8 pb-4 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
    <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight flex-1">Notifications</h1>
  </div>

  <!-- Scrollable content -->
  <div id="notif-content" class="flex-1 overflow-y-auto px-6 pt-2 pb-10 relative z-10 flex flex-col gap-7">

    <!-- General section -->
    <div id="general-section" class="flex flex-col gap-3">
      <p class="text-[#EEEEEE]/40 text-xs font-medium uppercase tracking-wide px-1">General</p>

      <div id="general-card" class="bg-[#393E46] rounded-2xl overflow-hidden">

        <!-- New releases -->
        <div id="new-releases-row" class="flex items-center gap-3 px-4 py-4">
          <div class="w-9 h-9 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-compact-disc text-[#FFD369] text-sm"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[#EEEEEE] text-sm font-medium">New releases</p>
            <p class="text-[#EEEEEE]/40 text-xs mt-0.5">Get notified when artists you follow drop new music</p>
          </div>
          <button type="button" id="new-releases-toggle" onclick="toggleSwitch('new-releases-toggle')" data-on="true" class="w-11 h-6 rounded-full bg-[#FFD369] flex items-center px-0.5 justify-end shrink-0 transition-colors">
            <span class="w-5 h-5 rounded-full bg-[#222831]"></span>
          </button>
        </div>

        <div class="h-px bg-[#222831] mx-4"></div>

        <!-- Quiet hours -->
        <div id="quiet-hours-row" class="flex items-center gap-3 px-4 py-4">
          <div class="w-9 h-9 rounded-xl bg-[#FFD369]/12 flex items-center justify-center shrink-0">
            <i class="fa-solid fa-moon text-[#FFD369] text-sm"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-[#EEEEEE] text-sm font-medium">Quiet hours</p>
            <p id="quiet-hours-sub" class="text-[#EEEEEE]/40 text-xs mt-0.5">22:00 – 07:00 · No notifications</p>
          </div>
          <button type="button" id="quiet-hours-toggle" onclick="toggleSwitch('quiet-hours-toggle')" data-on="true" class="w-11 h-6 rounded-full bg-[#FFD369] flex items-center px-0.5 justify-end shrink-0 transition-colors">
            <span class="w-5 h-5 rounded-full bg-[#222831]"></span>
          </button>
        </div>

        <div id="quiet-hours-range-row" class="flex items-center justify-between px-4 pb-4 pt-0.5">
          <span class="text-[#EEEEEE]/50 text-xs">From</span>
          <div class="flex items-center gap-2">
            <span class="bg-[#222831] text-[#EEEEEE] text-xs font-semibold px-3 py-1.5 rounded-lg">22:00</span>
            <i class="fa-solid fa-arrow-right text-[#EEEEEE]/30 text-[10px]"></i>
            <span class="bg-[#222831] text-[#EEEEEE] text-xs font-semibold px-3 py-1.5 rounded-lg">07:00</span>
          </div>
        </div>

      </div>
    </div>

    <!-- Artists section -->
    <div id="artists-section" class="flex flex-col gap-3">
      <p class="text-[#EEEEEE]/40 text-xs font-medium uppercase tracking-wide px-1">Artists</p>
      <p class="text-[#EEEEEE]/40 text-xs px-1 -mt-2">Mute release alerts from individual artists you follow</p>

      <div id="artists-card" class="bg-[#393E46] rounded-2xl overflow-hidden">

        <!-- Amaara - unmuted -->
        <div id="artist-notif-amaara" class="flex items-center gap-3 px-4 py-4">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-5.jpg" class="w-10 h-10 rounded-full object-cover shrink-0" alt="Amaara Mensah">
          <div class="flex-1 min-w-0">
            <p class="text-[#EEEEEE] text-sm font-medium truncate">Amaara Mensah</p>
            <p class="text-[#EEEEEE]/40 text-xs mt-0.5">Notifications on</p>
          </div>
          <button type="button" id="mute-amaara-toggle" onclick="toggleSwitch('mute-amaara-toggle')" data-on="true" class="w-11 h-6 rounded-full bg-[#FFD369] flex items-center px-0.5 justify-end shrink-0 transition-colors">
            <span class="w-5 h-5 rounded-full bg-[#222831]"></span>
          </button>
        </div>

        <div class="h-px bg-[#222831] mx-4"></div>

        <!-- Kweku - muted -->
        <div id="artist-notif-kweku" class="flex items-center gap-3 px-4 py-4">
          <img src="https://storage.googleapis.com/uxpilot-auth.appspot.com/avatars/avatar-2.jpg" class="w-10 h-10 rounded-full object-cover shrink-0 opacity-60" alt="Kweku Darko">
          <div class="flex-1 min-w-0">
            <p class="text-[#EEEEEE]/70 text-sm font-medium truncate">Kweku Darko</p>
            <p class="text-[#EEEEEE]/40 text-xs mt-0.5">Muted</p>
          </div>
          <button type="button" id="mute-kweku-toggle" onclick="toggleSwitch('mute-kweku-toggle')" data-on="false" class="w-11 h-6 rounded-full bg-[#222831] flex items-center px-0.5 justify-start shrink-0 transition-colors">
            <span class="w-5 h-5 rounded-full bg-[#EEEEEE]/30"></span>
          </button>
        </div>

      </div>
    </div>

  </div>

</div>
<script>
  function toggleSwitch(id) {
    const el = document.getElementById(id);
    const isOn = el.getAttribute('data-on') === 'true';
    const knob = el.querySelector('span');
    const row = el.closest('div[id]');
    const sub = row ? row.querySelector('p.text-\\[\\#EEEEEE\\]\\/40, p.mt-0\\.5') : null;

    if (isOn) {
      el.setAttribute('data-on', 'false');
      el.classList.remove('bg-[#FFD369]', 'justify-end');
      el.classList.add('bg-[#222831]', 'justify-start');
      knob.classList.remove('bg-[#222831]');
      knob.classList.add('bg-[#EEEEEE]/30');
    } else {
      el.setAttribute('data-on', 'true');
      el.classList.remove('bg-[#222831]', 'justify-start');
      el.classList.add('bg-[#FFD369]', 'justify-end');
      knob.classList.remove('bg-[#EEEEEE]/30');
      knob.classList.add('bg-[#222831]');
    }

    if (id === 'mute-amaara-toggle' || id === 'mute-kweku-toggle') {
      const nameEl = row.querySelector('p.text-sm');
      const subEl = row.querySelector('p.mt-0\\.5');
      const img = row.querySelector('img');
      const nowOn = el.getAttribute('data-on') === 'true';
      if (subEl) subEl.textContent = nowOn ? 'Notifications on' : 'Muted';
      if (nameEl) {
        nameEl.classList.toggle('text-[#EEEEEE]', nowOn);
        nameEl.classList.toggle('text-[#EEEEEE]/70', !nowOn);
      }
      if (img) img.classList.toggle('opacity-60', !nowOn);
    }

    if (id === 'quiet-hours-toggle') {
      const rangeRow = document.getElementById('quiet-hours-range-row');
      const nowOn = el.getAttribute('data-on') === 'true';
      rangeRow.classList.toggle('opacity-30', !nowOn);
      rangeRow.classList.toggle('pointer-events-none', !nowOn);
      const sub = document.getElementById('quiet-hours-sub');
      sub.textContent = nowOn ? '22:00 – 07:00 · No notifications' : 'Off';
    }
  }
</script>
</body>
</html>
