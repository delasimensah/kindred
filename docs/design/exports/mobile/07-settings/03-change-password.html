<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="change-password-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -left-16 w-72 h-72 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="password-topbar" class="flex items-center gap-4 px-6 pt-8 pb-2 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="password-content" class="flex-1 overflow-y-auto px-6 pt-4 pb-6 relative z-10 flex flex-col gap-7">

    <!-- Header -->
    <div id="password-header" class="flex flex-col gap-2">
      <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight">Change password</h1>
      <p class="text-[#EEEEEE]/60 text-sm leading-relaxed">Use at least 8 characters, including a number.</p>
    </div>

    <!-- Form -->
    <form id="password-form" class="flex flex-col gap-4">

      <!-- Current password -->
      <div id="current-password-field" class="flex flex-col gap-2">
        <label for="current-password" class="text-[#EEEEEE]/60 text-xs font-medium uppercase tracking-wide px-1">Current password</label>
        <div class="relative">
          <input type="password" id="current-password" placeholder="Enter current password" class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-sm rounded-2xl px-4 py-4 pr-12 outline-none focus:ring-2 focus:ring-[#FFD369]/50">
          <button type="button" onclick="togglePwd('current-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#EEEEEE]/40">
            <i class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <!-- New password -->
      <div id="new-password-field" class="flex flex-col gap-2">
        <label for="new-password" class="text-[#EEEEEE]/60 text-xs font-medium uppercase tracking-wide px-1">New password</label>
        <div class="relative">
          <input type="password" id="new-password" placeholder="Enter new password" class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-sm rounded-2xl px-4 py-4 pr-12 outline-none focus:ring-2 focus:ring-[#FFD369]/50">
          <button type="button" onclick="togglePwd('new-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#EEEEEE]/40">
            <i class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Confirm password -->
      <div id="confirm-password-field" class="flex flex-col gap-2">
        <label for="confirm-password" class="text-[#EEEEEE]/60 text-xs font-medium uppercase tracking-wide px-1">Confirm new password</label>
        <div class="relative">
          <input type="password" id="confirm-password" placeholder="Re-enter new password" class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-sm rounded-2xl px-4 py-4 pr-12 outline-none focus:ring-2 focus:ring-[#FFD369]/50">
          <button type="button" onclick="togglePwd('confirm-password', this)" class="absolute right-4 top-1/2 -translate-y-1/2 text-[#EEEEEE]/40">
            <i class="fa-solid fa-eye text-sm"></i>
          </button>
        </div>
      </div>

      <!-- Info note -->
      <div id="password-note" class="flex items-start gap-3 px-1 pt-1">
        <i class="fa-solid fa-circle-info text-[#EEEEEE]/30 text-sm mt-0.5"></i>
        <p class="text-[#EEEEEE]/40 text-xs leading-relaxed flex-1">You'll stay signed in on this device after changing your password.</p>
      </div>

    </form>

  </div>

  <!-- Sticky CTA -->
  <div id="password-cta-bar" class="px-6 pt-3 pb-8 bg-gradient-to-t from-[#222831] via-[#222831] to-transparent relative z-10">
    <button type="button" id="save-password-btn" class="w-full bg-[#FFD369] text-[#222831] font-bold text-base rounded-full py-4 text-center">Save password</button>
  </div>

</div>
<script>
  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.remove('fa-eye');
      icon.classList.add('fa-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.remove('fa-eye-slash');
      icon.classList.add('fa-eye');
    }
  }
</script>
</body>
</html>
