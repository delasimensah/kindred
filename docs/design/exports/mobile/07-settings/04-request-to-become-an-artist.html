<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Become an Artist</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Satoshi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  @font-face {
    font-family: 'Clash Display';
    src: local('Clash Display');
    font-weight: 700;
  }
  body { font-family: 'Satoshi', 'Inter', sans-serif; }
  .font-display { font-family: 'Clash Display', 'Satoshi', sans-serif; }
</style>
</head>
<body class="bg-[#222831]">
<div id="become-artist-screen" class="w-full max-w-[430px] mx-auto min-h-[932px] bg-[#222831] flex flex-col relative overflow-hidden">

  <!-- Decorative glow -->
  <div class="absolute -top-24 -right-16 w-72 h-72 bg-[#FFD369]/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Top bar -->
  <div id="artist-request-topbar" class="flex items-center gap-4 px-6 pt-8 pb-2 relative z-10">
    <button type="button" id="back-btn" class="w-9 h-9 rounded-full bg-[#393E46] flex items-center justify-center shrink-0">
      <i class="fa-solid fa-chevron-left text-[#EEEEEE] text-sm"></i>
    </button>
  </div>

  <!-- Scrollable content -->
  <div id="artist-request-content" class="flex-1 overflow-y-auto px-6 pt-4 pb-6 relative z-10 flex flex-col gap-6">

    <!-- Pending banner (optional) -->
    <div id="pending-banner" class="flex items-center gap-3 bg-[#393E46] border border-[#FFD369]/30 rounded-2xl px-4 py-3.5">
      <div class="w-9 h-9 rounded-full bg-[#FFD369]/15 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-hourglass-half text-[#FFD369] text-sm"></i>
      </div>
      <div class="flex-1 min-w-0">
        <p class="text-[#EEEEEE] text-sm font-semibold">Request pending review</p>
        <p class="text-[#EEEEEE]/40 text-xs mt-0.5">Submitted 2 days ago · We'll email you within 5–7 days</p>
      </div>
    </div>

    <!-- Header -->
    <div id="artist-request-header" class="flex flex-col gap-2">
      <h1 class="font-display font-bold text-[26px] text-[#EEEEEE] tracking-tight">Become an artist.</h1>
      <p class="text-[#EEEEEE]/60 text-sm leading-relaxed">Tell us about yourself. Our team reviews every request by hand.</p>
    </div>

    <!-- Form -->
    <form id="artist-request-form" class="flex flex-col gap-4">

      <!-- Display name -->
      <div id="display-name-field" class="flex flex-col gap-2">
        <label for="display-name" class="text-[#EEEEEE]/60 text-xs font-medium uppercase tracking-wide px-1">Display name</label>
        <input type="text" id="display-name" placeholder="e.g. Efua Boateng" value="Efua Boateng" class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-sm rounded-2xl px-4 py-4 outline-none focus:ring-2 focus:ring-[#FFD369]/50">
      </div>

      <!-- Bio -->
      <div id="bio-field" class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-1">
          <label for="artist-bio" class="text-[#EEEEEE]/60 text-xs font-medium uppercase tracking-wide">Bio</label>
          <span id="bio-count" class="text-[#EEEEEE]/30 text-xs">0 / 200</span>
        </div>
        <textarea id="artist-bio" rows="4" maxlength="200" oninput="updateCount('artist-bio','bio-count',200)" placeholder="Share your sound, your story, and what makes your music yours." class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-sm rounded-2xl px-4 py-4 outline-none resize-none focus:ring-2 focus:ring-[#FFD369]/50"></textarea>
      </div>

      <!-- Why -->
      <div id="why-field" class="flex flex-col gap-2">
        <div class="flex items-center justify-between px-1">
          <label for="artist-why" class="text-[#EEEEEE]/60 text-xs font-medium uppercase tracking-wide">Why do you want to join as an artist?</label>
          <span id="why-count" class="text-[#EEEEEE]/30 text-xs">0 / 300</span>
        </div>
        <textarea id="artist-why" rows="5" maxlength="300" oninput="updateCount('artist-why','why-count',300)" placeholder="Tell us about your music, where it's been released, and links to your work." class="w-full bg-[#393E46] text-[#EEEEEE] placeholder-[#EEEEEE]/30 text-sm rounded-2xl px-4 py-4 outline-none resize-none focus:ring-2 focus:ring-[#FFD369]/50"></textarea>
      </div>

      <!-- Info note -->
      <div id="artist-request-note" class="flex items-start gap-3 px-1 pt-1">
        <i class="fa-solid fa-circle-info text-[#EEEEEE]/30 text-sm mt-0.5"></i>
        <p class="text-[#EEEEEE]/40 text-xs leading-relaxed flex-1">Approved artist profiles get a badge and appear in search and recommendations.</p>
      </div>

    </form>

  </div>

  <!-- Sticky CTA -->
  <div id="artist-request-cta-bar" class="px-6 pt-3 pb-8 bg-gradient-to-t from-[#222831] via-[#222831] to-transparent relative z-10">
    <button type="button" id="submit-request-btn" class="w-full bg-[#FFD369] text-[#222831] font-bold text-base rounded-full py-4 text-center">Submit request</button>
  </div>

</div>
<script>
  function updateCount(inputId, countId, max) {
    const input = document.getElementById(inputId);
    const count = document.getElementById(countId);
    count.textContent = input.value.length + ' / ' + max;
  }
</script>
</body>
</html>
