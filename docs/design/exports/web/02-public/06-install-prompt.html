<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Install Prompt</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#FFD369',
          label: '#222831',
          page: '#222831',
          surface: '#393E46',
          text: '#EEEEEE'
        },
        fontFamily: {
          sans: ['Satoshi', 'Space Grotesk', 'sans-serif'],
          display: ['Clash Display', 'Space Grotesk', 'sans-serif']
        }
      }
    }
  }
</script>
<style>
  body { font-family: 'Satoshi','Space Grotesk',sans-serif; }
  .font-display { font-family: 'Clash Display','Space Grotesk',sans-serif; }
</style>
</head>
<body class="bg-page text-text">

<div id="install-prompt-page" class="relative w-full min-w-[1280px] bg-page overflow-hidden">

  <!-- Backdrop: browse page dimmed -->
  <div id="backdrop" class="opacity-40 pointer-events-none select-none">
    <header id="topbar" class="h-16 flex items-center justify-between px-10 border-b border-white/5">
      <a href="#" id="brand" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center">
          <i class="fa-solid fa-waveform-lines text-label text-xs"></i>
        </div>
        <span class="font-display text-lg tracking-tight text-text">Kindred</span>
      </a>
      <button class="flex items-center gap-2 text-sm font-semibold text-label bg-primary px-5 py-2.5 rounded-xl">
        <i class="fa-solid fa-mobile-screen-button text-xs"></i> Get the app
      </button>
    </header>
    <main class="px-10 py-9">
      <div id="featured-hero-card" class="relative h-64 rounded-2xl overflow-hidden mb-10">
        <img class="absolute inset-0 w-full h-full object-cover" src="https://storage.googleapis.com/uxpilot-auth.appspot.com/gen_58ca603296_3a029b5d2fa7141a.png" alt="highlife concert stage warm amber lighting, cinematic wide banner, Ghanaian music culture, golden to" />
        <div class="absolute inset-0 bg-gradient-to-r from-page/95 via-page/50 to-transparent"></div>
      </div>
      <div class="grid grid-cols-4 gap-5">
        <div class="h-40 bg-surface rounded-2xl"></div>
        <div class="h-40 bg-surface rounded-2xl"></div>
        <div class="h-40 bg-surface rounded-2xl"></div>
        <div class="h-40 bg-surface rounded-2xl"></div>
      </div>
    </main>
  </div>

  <!-- Dim overlay -->
  <div id="scrim" class="absolute inset-0 bg-page/70"></div>

  <!-- Install banner -->
  <div id="install-banner" class="absolute inset-0 flex items-center justify-center px-6">
    <div id="install-card" class="w-full max-w-[480px] bg-surface rounded-3xl border border-white/10 shadow-2xl p-9 text-center relative">
      <button id="dismiss-btn" class="absolute top-5 right-5 text-text/35 hover:text-text/70 transition">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div id="app-icon" class="w-20 h-20 rounded-2xl bg-primary mx-auto mb-6 flex items-center justify-center shadow-lg">
        <i class="fa-solid fa-waveform-lines text-label text-3xl"></i>
      </div>

      <h1 class="font-display text-2xl text-text mb-2.5">Listen with the full Kindred app</h1>
      <p class="text-sm text-text/60 leading-relaxed mb-8 max-w-sm mx-auto">Unlock offline downloads, exclusive posts, and the full listening experience by Amaara Mensah and every artist you follow.</p>

      <button id="open-app-btn" class="w-full bg-primary text-label text-sm font-semibold py-3.5 rounded-xl hover:brightness-95 transition mb-4">
        Open app
      </button>

      <div id="store-badges" class="flex items-center justify-center gap-3 mb-6">
        <a href="#" class="flex items-center gap-2.5 bg-page border border-white/10 rounded-xl px-4 py-2.5 hover:bg-white/5 transition">
          <i class="fa-brands fa-apple text-xl text-text"></i>
          <div class="text-left leading-none">
            <p class="text-[9px] text-text/50">Download on the</p>
            <p class="text-xs font-semibold text-text mt-0.5">App Store</p>
          </div>
        </a>
        <a href="#" class="flex items-center gap-2.5 bg-page border border-white/10 rounded-xl px-4 py-2.5 hover:bg-white/5 transition">
          <i class="fa-brands fa-google-play text-lg text-text"></i>
          <div class="text-left leading-none">
            <p class="text-[9px] text-text/50">Get it on</p>
            <p class="text-xs font-semibold text-text mt-0.5">Google Play</p>
          </div>
        </a>
      </div>

      <button id="continue-web-btn" class="text-xs text-text/40 hover:text-text/70 transition underline">
        Continue in browser
      </button>
    </div>
  </div>

</div>

</body>
</html>
